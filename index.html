<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>JSON Formatter</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        textarea { width: 100%; height: 150px; margin-bottom: 10px; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto; white-space: pre-wrap; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>JSON 特定キー改行フォーマッター</h2>
    <p>JSONオブジェクトを入力してください：</p>
    <textarea id="jsonInput">{
}</textarea>

    <button onclick="formatJson()">整形実行</button>

    <h3>出力結果:</h3>
    <pre id="output"></pre>

    <script>
        function formatJson() {
            const input = document.getElementById('jsonInput').value;
            const outputElement = document.getElementById('output');

            try {
                // 1. まずオブジェクトとしてパース
                const obj = JSON.parse(input);
                
                // 2. 一旦、すべての空白を除去して1行の文字列にする
                let rawJson = JSON.stringify(obj);

                // 3. 正規表現で各キーの前に改行を入れる
                // 原理：最初の "{" を除き、トップレベルの "key": の前に改行とカンマを調整
                // 
                // 置換ルール: 
                // - 最初と最後の中括弧を維持しつつ、
                // - 途中の `"key":` のパターンを見つけてその前に改行を入れる
                
                let formatted = rawJson
                    .replace(/^{/, '{\n')            // 開始の中括弧の後に改行
                    .replace(/}$/, '\n}')            // 閉じの中括弧の前に改行
                    .replace(/,"([^"]+)":{/g, ',\n"$1": {'); // キーの開始ごとに改行

                outputElement.textContent = formatted;
            } catch (e) {
                outputElement.textContent = "エラー: 正しいJSON形式ではありません。\n" + e.message;
            }
        }
    </script>
</body>
</html>

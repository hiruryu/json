<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Line Formatter</title>
    <style>
        :root { --primary-color: #4a90e2; --bg-color: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); padding: 40px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; color: #2c3e50; border-left: 5px solid var(--primary-color); padding-left: 15px; }
        textarea { width: 100%; height: 250px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Courier New', Courier, monospace; font-size: 14px; box-sizing: border-box; resize: vertical; }
        .controls { margin: 20px 0; text-align: center; }
        button { background-color: var(--primary-color); color: white; border: none; padding: 12px 30px; font-size: 16px; border-radius: 6px; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #357abd; }
        .output-label { font-weight: bold; margin-bottom: 10px; display: block; }
        #output { background: #282c34; color: #abb2bf; padding: 20px; border-radius: 8px; overflow-x: auto; font-family: 'Courier New', Courier, monospace; font-size: 14px; white-space: pre; min-height: 50px; }
        .error { color: #e74c3c; background: #fdf2f2; border: 1px solid #e74c3c; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>JSON キー別1行変換</h2>
    <p>JSONを貼り付けて「変換」を押すと、各キーごとに改行しつつ中身を1行にまとめます。</p>
    
    <textarea id="jsonInput" placeholder='ここにJSONを貼り付けてください...'></textarea>

    <div class="controls">
        <button onclick="transformJson()">変換を実行する</button>
    </div>

    <span class="output-label">出力結果:</span>
    <pre id="output">変換後のJSONがここに表示されます</pre>
</div>

<script>
    function transformJson() {
        const input = document.getElementById('jsonInput').value.trim();
        const output = document.getElementById('output');

        if (!input) {
            output.innerHTML = '<span class="error">入力が空です。</span>';
            return;
        }

        try {
            // 1. JSONとして解析
            const data = JSON.parse(input);
            
            // 2. 一旦、インデントなしの完全な1行にする
            const minified = JSON.stringify(data);

            // 3. 正規表現を使って、トップレベルのキーの前に改行を入れる
            // 前提: オブジェクト形式であること
            let result = minified
                .replace(/^\{/, '{\n  ')                // 最初の { 
                .replace(/\}$/, '\n}')                  // 最後の }
                .replace(/,"([^"]+)":/g, ',\n  "$1":'); // 各キーの前に改行とスペース2つを入れる

            output.textContent = result;
            output.style.color = "#abb2bf"; // エラー後のリセット用
        } catch (e) {
            output.innerHTML = '<span class="error">JSONの形式が正しくありません: ' + e.message + '</span>';
        }
    }
</script>

</body>
</html>
